[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "updatemenow"
version = "1.0.0"
description = "CLI cybersecurity update reporter for RSS and official public APIs"
readme = { text = "UpdateMeNow is a command-line cybersecurity update reporter for RSS feeds and official public APIs.", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "UpdateMeNow contributors" }
]
keywords = [
  "cybersecurity",
  "cve",
  "rss",
  "cli",
  "excel"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Utilities"
]
dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.7,<15.0",
  "feedparser>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
  "openpyxl>=3.1,<4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0"
]

[project.scripts]
umn = "updatemenow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/updatemenow"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
